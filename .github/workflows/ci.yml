name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # Exercises the real binary against a real image rather than the library
      # API, so the CLI wiring is covered too.
      - name: End-to-end on a demo image
        shell: bash
        run: |
          set -eu
          cargo run --quiet --example demo_image -- demo.img
          cargo run --quiet -- ls demo.img | tee ls.txt
          grep -q hello.txt ls.txt
          cargo run --quiet -- cat demo.img hello.txt > out.txt
          printf 'hello from easyfs\n' | diff - out.txt
          cargo run --quiet -- tree demo.img
          cargo run --quiet -- extract demo.img extracted
          test -f extracted/sub/inner.txt
          # A valid image must pass the checker with a zero exit code.
          cargo run --quiet -- check demo.img

      - name: JSON output parses
        shell: bash
        run: |
          set -eu
          for args in "ls demo.img" "stat demo.img" "check demo.img" "file demo.img hello.txt"; do
            cargo run --quiet -- $args --json | python3 -m json.tool > /dev/null
          done
          cargo run --quiet -- diff demo.img demo.img --json | python3 -m json.tool > /dev/null

      # The Python reader in docs/FORMAT.md is a claim about the format. If it
      # stops agreeing with the tool, one of them is wrong — fail rather than
      # ship a document that lies.
      - name: FORMAT.md reader still agrees with the tool
        shell: bash
        run: |
          set -eu
          cargo run --quiet --example demo_image -- demo.img
          awk '/^```python$/{f=1;next} /^```$/{f=0} f' docs/FORMAT.md > reader.py
          python3 reader.py demo.img | awk '{print $2}' > from_doc.txt
          cargo run --quiet -- ls demo.img --names-only | sort > from_tool.txt
          sort from_doc.txt | diff - from_tool.txt
          echo "FORMAT.md reader matches easyfs ls"
