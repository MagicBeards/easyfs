[package]
# The crate on crates.io is `easyfs-inspect` because `easyfs` was already taken
# by an unrelated crate in 2024. The library and the binary keep the name
# `easyfs`, so `use easyfs::` and the command users type are unchanged.
name = "easyfs-inspect"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "Inspect easy-fs filesystem images from the rCore tutorial, without booting the kernel"
license = "MIT"
repository = "https://github.com/MagicBeards/easyfs"
homepage = "https://github.com/MagicBeards/easyfs"
readme = "README.md"
keywords = ["filesystem", "rcore", "osdev", "riscv", "cli"]
categories = ["command-line-utilities", "filesystem"]
# `.gitignore` is only honoured when the package sits in a git repository, and
# this checkout is published through the API rather than by git, so the test
# artefacts have to be named explicitly.
exclude = ["*.img", "*.zip", "out_demo/", "extracted/", "target/"]

[lib]
name = "easyfs"
path = "src/lib.rs"

[[bin]]
name = "easyfs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
strip = true
